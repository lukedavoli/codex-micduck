<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <title>Codex MicDuck social image source</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 627px; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        background: #faf9fd;
        color: #292545;
      }
      .card { position: relative; width: 100%; height: 100%; padding: 65px 72px; }
      .eyebrow {
        margin: 0 0 26px;
        color: #615d75;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: 2.4px;
      }
      h1 { margin: 0 0 15px; font-size: 66px; font-weight: 750; line-height: 1.15; letter-spacing: -2.8px; }
      .tagline { margin: 0 0 31px; color: #494084; font-size: 37px; letter-spacing: -.9px; }
      .description { margin: 0 0 34px; font-size: 27px; line-height: 1.45; color: #615d75; }
      .badge { display: inline-block; margin: 0; padding: 11px 16px; border-radius: 9px; background: #eeeafb; color: #494084; font-size: 18px; font-weight: 600; }
      .icon { position: absolute; width: 380px; height: 380px; right: 53px; top: 105px; }
      .footer { position: absolute; left: 72px; right: 72px; bottom: 37px; border-top: 1px solid #ded9ed; padding-top: 19px; display: flex; justify-content: space-between; color: #615d75; font-size: 17px; }
      .maker { color: #494084; font-weight: 600; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">MACOS + CODEX + SPOTIFY</p>
      <h1>Codex MicDuck</h1>
      <p class="tagline">A little room to talk.</p>
      <p class="description">Automatically lowers Spotify<br>while you talk in Codex.</p>
      <p class="badge">Free &amp; open source · Apple silicon</p>
      <img class="icon" src="./assets/duck.png" alt="Codex MicDuck app icon" width="380" height="380">
      <div class="footer"><span class="maker">Davoli Software</span><span>codexmicduck.davolisoftware.com</span></div>
    </main>
  </body>
</html>
